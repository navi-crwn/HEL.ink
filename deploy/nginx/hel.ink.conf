# HOP router: hel.ink + hub.hel.ink + link.hel.ink + bio.hel.ink on one server.
# Cloudflare (free) in front for DNS, TLS edge, WAF, Turnstile; this origin uses a
# Cloudflare Origin Certificate for hel.ink and *.hel.ink.
#
#   hel.ink       /l/*   -> LinkHop  (short links, public)
#                 /b/*   -> BioHop   (bio pages, public)
#                 /api/* -> 308 to link.hel.ink/api      (remove after 27 Nov 2026)
#                 /{slug} one segment, not a hub page -> 301 /l/{slug}   (remove after 27 Nov 2026)
#                 everything else -> hub
#   hub.hel.ink   -> hub      link.hel.ink -> LinkHop      bio.hel.ink -> BioHop
#   p.hel.ink stays in its own file (PixelHop, proxy to 127.0.0.1:8080).
#
# Install: /etc/nginx/sites-available/hel.ink, symlink into sites-enabled (replaces the old hel.ink file),
# plus /etc/nginx/snippets/hop-laravel.conf. Then: nginx -t && systemctl reload nginx.

map $http_x_forwarded_proto $hop_scheme { default $scheme; https https; }

# --- legacy short-link redirect on hel.ink ------------------------------------------------
# One path segment of slug characters...
map $uri $hop_slug {
    default "";
    "~^/(?<s>[A-Za-z0-9_-]{1,100})$" $s;
}
# ...that is not a page the hub serves at the root. Keep in sync with the hub's single-segment routes.
map $uri $hop_hub_page {
    default 0;
    "~^/(about|announcements|api-docs|apps|changelog|contact|contact-us|csrf-token|dashboard|faq|goodbye|help|how-it-works|login|logout|onboarding|open-source|plans|privacy|products|profile|register|security|settings|signup|status|status\.json|terms|tos|two-factor-challenge|users|up|sitemap\.xml|robots\.txt|favicon\.ico|manifest\.json)$" 1;
}
map "$hop_hub_page:$hop_slug" $hop_legacy_redirect {
    default "";
    "~^0:(?<s>.+)$" $s;
}

# --- hel.ink (public) -----------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hel.ink;
    ssl_certificate     /etc/ssl/certs/hel.ink-origin.crt;
    ssl_certificate_key /etc/ssl/private/hel.ink-origin.key;
    access_log /var/log/nginx/helink.access.log;
    error_log  /var/log/nginx/helink.error.log;
    client_max_body_size 8m;

    location = /l {
        add_header Allow "GET, HEAD" always;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        return 301 https://link.hel.ink/$is_args$args;
    }
    location = /l/ {
        add_header Allow "GET, HEAD" always;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        return 301 https://link.hel.ink/$is_args$args;
    }
    location = /b {
        add_header Allow "GET, HEAD" always;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        return 301 https://bio.hel.ink/$is_args$args;
    }
    location = /b/ {
        add_header Allow "GET, HEAD" always;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        return 301 https://bio.hel.ink/$is_args$args;
    }

    # Short links (GET redirect, POST link password). Everything under /l/ is LinkHop's index.php.
    location ^~ /l/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/helink/linkhop/public/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/helink/linkhop/public;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Bio pages (GET page, POST password/age gate, click tracking). Everything under /b/ is BioHop's index.php.
    location ^~ /b/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/helink/biohop/public/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/helink/biohop/public;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Old API address. Remove after 27 Nov 2026.
    location ^~ /api/ {
        return 308 https://link.hel.ink$request_uri;
    }

    # HOP family assets (see deploy/nginx/hop-assets.conf).
    location ^~ /hop-assets/ {
        root /var/www/helink/hub/public;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /hop-assets/apps.json {
        root /var/www/helink/hub/public;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=300";
        default_type application/json;
        try_files $uri =404;
    }

    # Hub (home, marketing, status, login redirect). The legacy slug redirect lives here so that
    # hub pages always win: $hop_legacy_redirect is empty for them. Remove the `if` after 27 Nov 2026.
    location / {
        if ($hop_legacy_redirect) {
            return 301 /l/$hop_legacy_redirect;
        }
        set $hop_root /var/www/helink/hub/public;
        include snippets/hop-laravel.conf;
    }
}

# www -> apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.hel.ink;
    ssl_certificate     /etc/ssl/certs/hel.ink-origin.crt;
    ssl_certificate_key /etc/ssl/private/hel.ink-origin.key;
    return 301 https://hel.ink$request_uri;
}

# --- hub.hel.ink ----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hub.hel.ink;
    ssl_certificate     /etc/ssl/certs/hel.ink-origin.crt;
    ssl_certificate_key /etc/ssl/private/hel.ink-origin.key;
    access_log /var/log/nginx/hub.access.log;
    error_log  /var/log/nginx/hub.error.log;
    client_max_body_size 8m;
    # Imperium's content moderation API (HOP App Protocol) is LinkHop's: links, bio pages,
    # reports, IP and domain lists, settings. The account API (/api/hop/users, stats, …) is the hub's.
    location ~ ^/api/hop/(content|reports|x/|settings) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/helink/linkhop/public/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/helink/linkhop/public;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location / {
        set $hop_root /var/www/helink/hub/public;
        include snippets/hop-laravel.conf;
    }
}

# --- link.hel.ink ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name link.hel.ink;
    ssl_certificate     /etc/ssl/certs/hel.ink-origin.crt;
    ssl_certificate_key /etc/ssl/private/hel.ink-origin.key;
    access_log /var/log/nginx/linkhop.access.log;
    error_log  /var/log/nginx/linkhop.error.log;
    client_max_body_size 8m;
    # Built assets and uploads are also loaded by pages served at hel.ink/l/*, so allow that origin.
    location ^~ /build/   { root /var/www/helink/linkhop/public; add_header Access-Control-Allow-Origin "https://hel.ink"; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location ^~ /storage/ { root /var/www/helink/linkhop/public; add_header Access-Control-Allow-Origin "https://hel.ink"; try_files $uri =404; }
    location / {
        set $hop_root /var/www/helink/linkhop/public;
        include snippets/hop-laravel.conf;
    }
}

# --- bio.hel.ink ----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bio.hel.ink;
    ssl_certificate     /etc/ssl/certs/hel.ink-origin.crt;
    ssl_certificate_key /etc/ssl/private/hel.ink-origin.key;
    access_log /var/log/nginx/biohop.access.log;
    error_log  /var/log/nginx/biohop.error.log;
    client_max_body_size 16m;
    # Built assets and uploads are also loaded by pages served at hel.ink/b/*, so allow that origin.
    location ^~ /build/   { root /var/www/helink/biohop/public; add_header Access-Control-Allow-Origin "https://hel.ink"; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location ^~ /storage/ { root /var/www/helink/biohop/public; add_header Access-Control-Allow-Origin "https://hel.ink"; try_files $uri =404; }
    location / {
        set $hop_root /var/www/helink/biohop/public;
        include snippets/hop-laravel.conf;
    }
}

# --- http -> https ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name hel.ink www.hel.ink hub.hel.ink link.hel.ink bio.hel.ink;
    return 301 https://$host$request_uri;
}
