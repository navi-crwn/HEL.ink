q1 = Apa itu HOP ID?
a1 = HOP ID adalah layanan autentikasi terpusat untuk keluarga HOP. Satu akun bisa dipakai di LinkHop, BioHop, PixelHop, dan NoteHop.
q2 = Bisakah menjalankan hub tanpa aplikasi lain?
a2 = Ya. Hub dapat berjalan mandiri sebagai layanan akun, namun manfaat maksimal dirasakan bersama aplikasi keluarga HOP.
q3 = Bagaimana cara kerja logout tunggal?
a3 = Keluar dari hub akan mengakhiri sesi lokal dan mengirimkan sinyal logout berantai ke aplikasi yang terhubung.
