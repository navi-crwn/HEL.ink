# nginx router for the HOP family on one server. Cloudflare (free) in front: DNS, TLS edge, WAF, Turnstile.
# Origin certificate: a Cloudflare origin cert for hel.ink and *.hel.ink.
#
#   hel.ink       /l/*  -> LinkHop     (short links, public)
#                 /b/*  -> BioHop      (bio pages, public)
#                 /api/* -> LinkHop    (old API address; 308 to link.hel.ink/api, cabut setelah 27 Nov 2026)
#                 /*    -> hub         (home, marketing, status)
#                 /{slug} one segment -> 301 /l/{slug}   (cabut setelah 27 Nov 2026)
#   hub.hel.ink   -> hub        link.hel.ink -> LinkHop        bio.hel.ink -> BioHop        p.hel.ink -> PixelHop (existing)
#
# Each Laravel app has its own PHP-FPM pool (or one pool with different roots); paths below match the plan:
#   /var/www/helink/hub, /var/www/helink/linkhop, /var/www/helink/biohop

map $http_x_forwarded_proto $hop_scheme { default $scheme; https https; }

# ---- shared snippets ------------------------------------------------------
# php-fpm for a Laravel app rooted at $hop_root (set per server/location).
# Usage: set $hop_root /var/www/helink/hub/public; include snippets/hop-laravel.conf;
#
# snippets/hop-laravel.conf:
#   root $hop_root;
#   index index.php;
#   try_files $uri $uri/ /index.php?$query_string;
#   location ~ \.php$ {
#       include fastcgi_params;
#       fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
#       fastcgi_param DOCUMENT_ROOT $realpath_root;
#       fastcgi_pass unix:/run/php/php8.3-fpm.sock;
#   }
#   location ~ /\.(?!well-known) { deny all; }

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hel.ink www.hel.ink;
    ssl_certificate     /etc/ssl/certs/hel.ink-origin.crt;
    ssl_certificate_key /etc/ssl/private/hel.ink-origin.key;

    location = /l {
        add_header Allow "GET, HEAD" always;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        return 301 https://link.hel.ink/$is_args$args;
    }
    location = /l/ {
        add_header Allow "GET, HEAD" always;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        return 301 https://link.hel.ink/$is_args$args;
    }
    location = /b {
        add_header Allow "GET, HEAD" always;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        return 301 https://bio.hel.ink/$is_args$args;
    }
    location = /b/ {
        add_header Allow "GET, HEAD" always;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        return 301 https://bio.hel.ink/$is_args$args;
    }
    # Public short links: LinkHop answers /l/{slug} (GET redirect, POST link password).
    location ^~ /l/ {
        root /var/www/helink/linkhop/public;
        try_files /nonexistent /index.php?$query_string;
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/helink/linkhop/public/index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/helink/linkhop/public;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        }
    }
    # Public bio pages: BioHop answers /b/{slug}.
    location ^~ /b/ {
        root /var/www/helink/biohop/public;
        try_files /nonexistent /index.php?$query_string;
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/helink/biohop/public/index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/helink/biohop/public;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        }
    }
    # Old API address. Cabut setelah 27 Nov 2026 (30 hari setelah pengumuman Fase A).
    location ^~ /api/ {
        return 308 https://link.hel.ink$request_uri;
    }
    # Old short-link form hel.ink/{slug}: one path segment, letters/digits/dashes, not a hub page.
    # Hub pages (about, status, …) are matched first by the exact locations below.
    # Cabut setelah 27 Nov 2026.
    location ~ "^/([A-Za-z0-9-]{1,100})$" {
        return 301 /l/$1;
    }
    # Hub pages that must win over the slug redirect above (exact matches beat regex).
    location = /         { set $hop_root /var/www/helink/hub/public; include snippets/hop-laravel.conf; }
    location = /about    { set $hop_root /var/www/helink/hub/public; include snippets/hop-laravel.conf; }
    location = /contact  { set $hop_root /var/www/helink/hub/public; include snippets/hop-laravel.conf; }
    location = /privacy  { set $hop_root /var/www/helink/hub/public; include snippets/hop-laravel.conf; }
    location = /terms    { set $hop_root /var/www/helink/hub/public; include snippets/hop-laravel.conf; }
    location = /tos      { set $hop_root /var/www/helink/hub/public; include snippets/hop-laravel.conf; }
    location = /plans    { set $hop_root /var/www/helink/hub/public; include snippets/hop-laravel.conf; }
    location = /help     { set $hop_root /var/www/helink/hub/public; include snippets/hop-laravel.conf; }
    location = /faq      { set $hop_root /var/www/helink/hub/public; include snippets/hop-laravel.conf; }
    location = /products { set $hop_root /var/www/helink/hub/public; include snippets/hop-laravel.conf; }
    location = /status   { set $hop_root /var/www/helink/hub/public; include snippets/hop-laravel.conf; }
    location = /login    { set $hop_root /var/www/helink/hub/public; include snippets/hop-laravel.conf; }
    location = /register { set $hop_root /var/www/helink/hub/public; include snippets/hop-laravel.conf; }
    location = /dashboard { set $hop_root /var/www/helink/hub/public; include snippets/hop-laravel.conf; }
    location = /up       { set $hop_root /var/www/helink/hub/public; include snippets/hop-laravel.conf; }
    # HOP family assets (see deploy/nginx/hop-assets.conf).
    location ^~ /hop-assets/ {
        root /var/www/helink/hub/public;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /hop-assets/apps.json {
        root /var/www/helink/hub/public;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=300";
        default_type application/json;
        try_files $uri =404;
    }
    # Everything else (multi-segment paths, /announcements/*, /brand/*, /build/*): the hub.
    location / {
        set $hop_root /var/www/helink/hub/public;
        include snippets/hop-laravel.conf;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hub.hel.ink;
    ssl_certificate     /etc/ssl/certs/hel.ink-origin.crt;
    ssl_certificate_key /etc/ssl/private/hel.ink-origin.key;
    client_max_body_size 8m;
    location / { set $hop_root /var/www/helink/hub/public; include snippets/hop-laravel.conf; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name link.hel.ink;
    ssl_certificate     /etc/ssl/certs/hel.ink-origin.crt;
    ssl_certificate_key /etc/ssl/private/hel.ink-origin.key;
    client_max_body_size 8m;
    location / { set $hop_root /var/www/helink/linkhop/public; include snippets/hop-laravel.conf; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bio.hel.ink;
    ssl_certificate     /etc/ssl/certs/hel.ink-origin.crt;
    ssl_certificate_key /etc/ssl/private/hel.ink-origin.key;
    client_max_body_size 16m;
    location / { set $hop_root /var/www/helink/biohop/public; include snippets/hop-laravel.conf; }
}

server {
    listen 80;
    listen [::]:80;
    server_name hel.ink www.hel.ink hub.hel.ink link.hel.ink bio.hel.ink;
    return 301 https://$host$request_uri;
}
