# HOP family assets (fonts, logos, floating tiles, apps.json) served from the hub's
# public/hop-assets. Paste inside the `server { server_name hel.ink; ... }` block,
# before `location /`. Fonts and SRI-checked scripts are loaded cross-origin by the
# other HOP apps, so they need CORS; version folders (v1, v2, ...) never change, so
# they are cached for a year. apps.json changes when a version is added: 5 minutes.
location ^~ /hop-assets/ {
    root /var/www/helink/hub/public;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}
location = /hop-assets/apps.json {
    root /var/www/helink/hub/public;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=300";
    default_type application/json;
    try_files $uri =404;
}
