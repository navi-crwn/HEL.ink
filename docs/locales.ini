dir = ltr
page_title = HEL.ink · HOP ファミリーハブ & HOP ID
page_desc = LinkHop、BioHop、PixelHop、NoteHop のための中央アカウントポータル、HOP ID シングルサインオン、ファミリーディレクトリ。
og_title = HEL.ink · HOP ファミリーハブ
skip = メインコンテンツへスキップ
nav_label = メインナビゲーション
nav_features = 機能紹介
nav_run = セルフホスト
nav_faq = よくある質問
nav_family = HOP ファミリー
theme_btn_light = ライト
theme_btn_dark = ダーク
kicker = ファミリーハブ & アカウントポータル
h1 = すべてのアプリに、ひとつの HOP アカウント。
lede = HEL.ink は HOP のアカウントポータルおよびディレクトリです。HOP ID で一度ログインすれば、LinkHop、BioHop、PixelHop、NoteHop をシームレスに利用できます。
cta_main = hel.ink を訪問
cta_hub = Hub を開く
cta_code = GitHub で見る
hero_note = MIT ライセンスに基づく無料のオープンソースソフトウェア。
features_h = 主な機能
f1_t = シングルサインオン (HOP ID)
f1_d = 1 回のログインですべての HOP アプリに対応。署名付きチケットと連鎖ログアウトで安全を維持。
f2_t = 統合アプリランチャー
f2_d = どこからでもワンクリックで LinkHop、BioHop、PixelHop、NoteHop を行き来できます。
f3_t = 共有データベース構造
f3_d = 1 つの MySQL または SQLite でアカウントを保持し、アプリ別のマイグレーション台帳で競合を防止。
f4_t = 堅牢なアカウントセキュリティ
f4_d = Argon2id ハッシュ、TOTP 二要素認証、Cloudflare Turnstile 保護、メール確認に対応。
f5_t = ライブサービスウォッチドッグ
f5_d = 秘密情報を漏らすことなく、ファミリーアプリ全体の稼働状況と応答速度を自動監視。
f6_t = 集中管理されたファミリー資産
f6_d = 公式マーク、フォント、3D フローティングタイルが SRI ハッシュ付きで hel.ink から配信されます。
f7_t = きめ細やかな API トークン
f7_d = アプリ間通信や開発者自動化のためのスコープ付きサービストークンを発行可能。
f8_t = 完全なセルフホスト対応
f8_d = 100% 無料かつオープンソース。Hub 単体での運用も、単一の VPS 上で HOP 全体を構築することも自由です。
run_h = 独自の Hub を構築する
run_intro = Hub は標準的なモダン PHP 環境で動作します。
run_req_h = 前提条件
run_req = PHP 8.3 以上、Composer、Node.js 22 以上、SQLite または MySQL/MariaDB。
run_sso_h = SSO の設定
run_sso = .env に HOP_SSO_SECRET (32 文字以上) を設定して、ファミリーアプリ用の SSO チケットに署名します。
run_db_h = 共有データベース設定
run_db = LinkHop とデータベースを共有する場合は DB_MIGRATIONS_TABLE=migrations_hub を設定します。
run_note = 詳細な設定オプションは .env.example を参照してください。
faq_h = よくある質問
q1 = HOP ID とは何ですか？
a1 = HOP ID は HOP ファミリーの中央認証サービスです。1 つのアカウントで全アプリにアクセスできます。
q2 = 他のアプリなしで Hub を単体実行できますか？
a2 = はい。Hub は単体のアカウント・ディレクトリサービスとしても動作しますが、HOP アプリと併用することで真価を発揮します。
q3 = シングルログアウトはどのように機能しますか？
a3 = Hub からログアウトするとローカルセッションが破棄され、接続中の各アプリへ連鎖ログアウト信号が送信されます。
q4 = HEL.ink はオープンソースですか？
a4 = はい、HEL.ink およびすべての公開 HOP アプリは MIT ライセンスで提供されています。
family_h = HOP ファミリー
family_intro = HEL.ink はプライバシーを重視したオープンソース Web アプリファミリーの中心です。
