kicker = Family Hub & Account Portal
h1 = One HOP account for every app.
lede = HEL.ink is the account portal and family directory for HOP. Sign in once with your HOP ID and move smoothly between LinkHop, BioHop, PixelHop, and NoteHop.
cta_main = Visit hel.ink
cta_hub = Open Hub
cta_code = View on GitHub
hero_note = Free and open-source software under the MIT license.
features_h = Features
f1_t = Single Sign-On (HOP ID)
f1_d = One login covers all HOP apps. Signed tickets and chained logout keep every session consistent.
f2_t = Unified App Launcher
f2_d = Switch between LinkHop, BioHop, PixelHop, and NoteHop in one click from anywhere.
f3_t = Shared Database Architecture
f3_d = One MySQL or SQLite database stores all credentials, with dedicated migration tables per application.
f4_t = Robust Account Security
f4_d = Argon2id hashing, TOTP two-factor authentication, Cloudflare Turnstile bot protection, and email verification.
f5_t = Live Service Watchdog
f5_d = Automated health checks and latency monitoring across all member applications without secret exposure.
f6_t = Central Family Assets
f6_d = Official brand marks, fonts (Syne, Plus Jakarta Sans), and 3D floating tiles served from hel.ink with SRI hashes.
f7_t = Fine-Grained API Tokens
f7_d = Generate scoped service tokens for seamless cross-app communication and developer automation.
f8_t = Completely Self-Hostable
f8_d = 100% free and open source. Run the hub alone or host the entire HOP ecosystem on a single VPS.
run_h = Run your own hub
run_intro = The hub runs on standard modern PHP infrastructure.
run_req_h = Prerequisites
run_req = PHP 8.3+, Composer, Node.js 22+, and SQLite or MySQL/MariaDB.
run_sso_h = SSO Configuration
run_sso = Configure HOP_SSO_SECRET (32+ chars) in your .env to securely sign SSO tickets for downstream family apps.
run_db_h = Shared Database Setup
run_db = Set DB_MIGRATIONS_TABLE=migrations_hub to keep the hub migration ledger neatly isolated when sharing a database with LinkHop.
run_note = See .env.example for comprehensive configuration options and explanations.
faq_h = Frequently asked questions
q1 = What is HOP ID?
a1 = HOP ID is the central authentication service for the HOP family. Creating one account lets you sign into LinkHop, BioHop, PixelHop, and NoteHop.
q2 = Can I run the hub without other apps?
a2 = Yes. The hub can run standalone as an authentication and directory service, but it is at its best when paired with HOP apps.
q3 = How does single logout work?
a3 = Logging out from the hub terminates your local session and dispatches chained logout signals to connected apps.
q4 = Is HEL.ink open source?
a4 = Yes, HEL.ink and all public HOP apps are released under the permissive MIT license.
family_h = The HOP family
family_intro = HEL.ink is the hub for a family of privacy-respecting open-source web tools.
